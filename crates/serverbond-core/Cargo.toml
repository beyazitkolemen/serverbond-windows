[package]
name = "serverbond-core"
version = "1.3.2"
edition = "2021"
description = "Windows Laravel production environment manager"

[dependencies]
anyhow = "1"
base64 = "0.22"
dunce = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
fs2 = "0.4"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"
jsonschema = { version = "0.56", default-features = false }
tungstenite = { version = "0.30.0", features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Wdk_System_SystemServices"] }
