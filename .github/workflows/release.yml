name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-2022
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw "Release must run from the matching version tag." }
          if (-not (Test-Path "docs/releases/v$version.md")) { throw "Release notes are missing." }
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Focused UI regressions
        run: npm run test:ui
      - name: Release service test selection
        run: node --test scripts/ai/select-release-tests.test.mjs
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Core and desktop tests
        run: npm run test:rust:parallel
      - name: Rust checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Cloud roundtrip requires a separately provisioned Laravel/Reverb test instance.
      # MySQL and PostgreSQL installs run only when that service changed since the previous tag.
      - name: Real Windows environment tests
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 "HEAD^"
          if (-not $prev) { throw "Önceki sürüm etiketi bulunamadı." }
          Write-Host "Karşılaştırma: $prev..HEAD"
          $selected = @(node scripts/ai/select-release-tests.mjs $prev HEAD)
          if ($LASTEXITCODE -ne 0) { throw "Servis testi seçimi başarısız." }
          if ($selected.Count -eq 0) { Write-Host "Değişen servis yok; uzun ortam testi gerekmiyor." }
          $env:SERVERBOND_TEST_CACHE = Join-Path $env:RUNNER_TEMP 'serverbond-package-cache'
          New-Item -ItemType Directory -Force $env:SERVERBOND_TEST_CACHE | Out-Null
          foreach ($name in $selected) {
            Write-Host "Gerçek ortam testi: $name"
            if ($name -eq 'postgres') {
              cargo test -p serverbond-core --lib postgres::credential_tests --locked -- --ignored --nocapture --test-threads=1
            } else {
              cargo test -p serverbond-core --test $name --locked -- --ignored --nocapture --test-threads=1
            }
            if ($LASTEXITCODE -ne 0) { throw "Windows ortam testi başarısız: $name" }
          }
      - name: Signed Windows installer and updater manifest
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ServerBond v__VERSION__
          releaseBody: |
            Windows x64 kurulum paketi ve otomatik güncelleme bildirimi (`latest.json`).

            Ayrıntılar: docs/releases ve docs/updates.md
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
      - name: Unsigned Windows installer
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: npm run desktop:build:unsigned
      - name: Versioned checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $exe = Get-ChildItem target/release/serverbond-desktop.exe | Select-Object -First 1
          Copy-Item $exe.FullName "artifacts/ServerBond_${version}_x64.exe"
          $setup = Get-Item "target/release/bundle/nsis/ServerBond_${version}_x64-setup.exe"
          Copy-Item $setup.FullName "artifacts/ServerBond_${version}_x64-setup.exe"
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ServerBond-Windows-x64-release
          path: artifacts/*
      - name: Publish verified release assets
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "ServerBond $env:RELEASE_TAG" --notes-file "docs/releases/$env:RELEASE_TAG.md"
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release." }
          }
          gh release upload $env:RELEASE_TAG artifacts/* --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets." }
          gh release edit $env:RELEASE_TAG --notes-file "docs/releases/$env:RELEASE_TAG.md" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release." }
