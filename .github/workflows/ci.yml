name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Core and desktop tests
        run: cargo test --workspace --locked
      - name: Rust checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Real Windows environment tests
        if: github.event_name == 'workflow_dispatch'
        run: cargo test -p f4box-core --tests --locked -- --ignored --nocapture --test-threads=1
      - name: Desktop executable
        run: cargo build -p f4box-desktop --features tauri/custom-protocol --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: F4Box-Windows-x64
          path: target/release/f4box-desktop.exe
