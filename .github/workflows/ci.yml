name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Focused UI regressions
        run: npm run test:ui
      - name: Release service test selection
        run: node --test scripts/ai/select-release-tests.test.mjs
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Core and desktop tests
        run: npm run test:rust:parallel
      - name: MCP SDK interoperability
        run: npm run test:mcp
      - name: Rust checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Real Windows environment tests
        if: github.event_name == 'workflow_dispatch'
        run: cargo test -p serverbond-core --tests --locked -- --ignored --nocapture --test-threads=1
      - name: Desktop executable and installer
        run: npm run desktop:build:unsigned
      - name: Installer path defaults and upgrade compatibility
        shell: pwsh
        run: ./scripts/ai/test-installer-paths.ps1
      - name: Package versioned artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item target/release/serverbond-desktop.exe "artifacts/ServerBond_${version}_x64.exe"
          $setup = Get-Item "target/release/bundle/nsis/ServerBond_${version}_x64-setup.exe" -ErrorAction SilentlyContinue
          if (-not $setup) {
            throw "NSIS kurulum paketi bulunamadı."
          }
          Copy-Item $setup.FullName "artifacts/ServerBond_${version}_x64-setup.exe"
          Get-ChildItem artifacts/*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ServerBond-Windows-x64-${{ matrix.os }}
          path: artifacts/*
