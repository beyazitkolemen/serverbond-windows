[package]
name = "serverbond-desktop"
version = "1.1.1"
edition = "2021"
default-run = "serverbond-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
serverbond-core = { path = "../crates/serverbond-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation"] }
